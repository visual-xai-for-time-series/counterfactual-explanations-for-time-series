[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactuals-for-time-series"
version = "0.1.7"
description = "Counterfactual explanation algorithms for time-series models (Wachter, Native-Guide, etc.)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "Udo Schlegel" }
]

keywords = ["counterfactual", "explainability", "xai", "time series"]

# Keep dependencies lean; users can add GPU/CPU-specific torch builds.
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "scikit-learn>=1.1",
  "torch>=1.12",
  "captum>=0.6",
  "tqdm>=4.64",
  "stumpy>=1.12",
  "pyts>=0.12",
]

[project.optional-dependencies]
dtw = ["dtaidistance>=2.3"]
# Extra proximity-metric backends used by cfts.metrics.proximity (lazily
# imported there with a friendly ImportError if missing).
proximity = [
  "tslearn>=0.6.3",
  "fastdtw>=0.3.4",
]
# EMD decomposer for cfts.cf_imfact.imfact (decomposer="emd"); imports as
# `emd` (emd.sift.sift) — distinct from the unrelated "EMD-signal"/PyEMD
# package, which exposes a different API.
imfact = ["emd>=0.6.0"]
# Wavelet decomposition path in cfts.cf_fft_cf.fft_cf.
fft = ["pywavelets>=1.8.0"]
# BoRF pipeline backing cf_mascots (MASCOTS); required to actually run
# mascots_cf, not just to import cfts.
mascots = [
  "sparse>=0.15",
  "numba>=0.59",
]
examples = [
  "matplotlib>=3.5",
  "seaborn>=0.13",
  "pandas>=2.0",
  "aeon>=1.0",
]
all = [
  "dtaidistance>=2.3",
  "tslearn>=0.6.3",
  "fastdtw>=0.3.4",
  "emd>=0.6.0",
  "pywavelets>=1.8.0",
  "sparse>=0.15",
  "numba>=0.59",
  "matplotlib>=3.5",
  "seaborn>=0.13",
  "pandas>=2.0",
  "aeon>=1.0",
]

[project.urls]
Homepage = "https://github.com/visual-xai-for-time-series/counterfactual-explanations-for-time-series"
Repository = "https://github.com/visual-xai-for-time-series/counterfactual-explanations-for-time-series"
Issues = "https://github.com/visual-xai-for-time-series/counterfactual-explanations-for-time-series/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cfts*"]
